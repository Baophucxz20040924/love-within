# Runs on the VPS in /opt/look-within (copied there by the GitHub Action).
# Reads ./.env on the VPS (secrets, never in git). The workflow keeps the IMAGE= line in that file up to date.
services:
  api:
    image: ${IMAGE:?IMAGE is not set in .env}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
    expose:
      - "4000"
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # HTTPS for CloudFront -> VPS. Caddy gets and renews the Let's Encrypt certificate by itself.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_ORIGIN_DOMAIN: ${API_ORIGIN_DOMAIN:?API_ORIGIN_DOMAIN is not set in .env}
      ORIGIN_SECRET: ${ORIGIN_SECRET:?ORIGIN_SECRET is not set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

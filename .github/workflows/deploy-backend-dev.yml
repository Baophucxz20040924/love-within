name: Deploy backend (dev)

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the image to GHCR

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PATH: ${{ secrets.VPS_PATH || '/opt/look-within' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Typecheck
        working-directory: backend
        run: |
          npm ci
          npm run typecheck

      - name: Image name
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          set -eu
          scp -P "$VPS_PORT" backend/docker-compose.yml backend/Caddyfile "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Pull and restart on the VPS
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The short-lived GITHUB_TOKEN is only used to pull this image during this run.
          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "set -eu
            cd '$VPS_PATH'
            test -f .env || { echo 'Missing $VPS_PATH/.env on the VPS'; exit 1; }
            sed -i '/^IMAGE=/d' .env
            printf 'IMAGE=%s\n' '$IMAGE' >> .env
            docker compose pull
            docker compose up -d --remove-orphans
            for i in \$(seq 1 30); do
              status=\$(docker inspect --format '{{.State.Health.Status}}' \$(docker compose ps -q api) 2>/dev/null || echo starting)
              echo \"api health: \$status\"
              if [ \"\$status\" = healthy ]; then docker image prune -f >/dev/null; exit 0; fi
              sleep 4
            done
            docker compose logs --tail 80 api
            exit 1"

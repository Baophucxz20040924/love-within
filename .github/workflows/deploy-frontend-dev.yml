name: Deploy frontend (dev)

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: false

permissions:
  id-token: write # OIDC to AWS, no long-lived access keys in GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build # tsc -b && vite build -> dist/ (API base is the relative /api, no env needed)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Upload hashed assets (cache 1 year)
        run: |
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" \
            --exclude '*' --include 'assets/*' \
            --cache-control 'public,max-age=31536000,immutable'

      - name: Upload everything else (index.html, sw.js, manifest, icons: always revalidate)
        run: |
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" \
            --exclude 'assets/*' --delete \
            --cache-control 'no-cache'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/index.html' '/sw.js' '/manifest.webmanifest' '/icon.svg' '/icons/*'

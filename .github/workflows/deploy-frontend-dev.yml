name: Deploy frontend (dev)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: false

permissions:
  id-token: write # OIDC to AWS, no long-lived access keys in GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build # tsc -b && vite build -> dist/ (API base is the relative /api, no env needed)

      - name: Diagnose AWS OIDC identity (no credentials logged)
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          node --input-type=module <<'NODE'
          const arn = process.env.DEPLOY_ROLE_ARN ?? '';
          const role = /^arn:aws:iam::(\d{12}):role\/(\S+)$/.exec(arn);
          if (!role) {
            console.error('::error::AWS_DEPLOY_ROLE_ARN must be a complete IAM role ARN without whitespace. Update the secret in environment dev.');
            process.exit(1);
          }
          // Account and role name are identifiers, not credentials. Never log the JWT.
          console.log(JSON.stringify({ roleAccount: role[1], roleName: role[2] }));
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'sts.amazonaws.com');
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!response.ok) {
            console.error(`::error::Unable to request OIDC token (HTTP ${response.status}).`);
            process.exit(1);
          }
          const { value } = await response.json();
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'));
          // Subject formats may include immutable owner/repository IDs or be customized.
          // AWS must enforce the exact subject via the role trust policy, not this diagnostic.
          console.log(JSON.stringify({ sub: claims.sub, aud: claims.aud, iss: claims.iss }));
          if (claims.aud !== 'sts.amazonaws.com' ||
              claims.iss !== 'https://token.actions.githubusercontent.com') {
            console.error('::error::Unexpected OIDC audience or issuer.');
            process.exit(1);
          }
          NODE

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Upload hashed assets (cache 1 year)
        run: |
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" \
            --exclude '*' --include 'assets/*' \
            --cache-control 'public,max-age=31536000,immutable'

      - name: "Upload everything else (index.html, sw.js, manifest, icons: always revalidate)"
        run: |
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" \
            --exclude 'assets/*' --delete \
            --cache-control 'no-cache'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/index.html' '/sw.js' '/manifest.webmanifest' '/icon.svg' '/icons/*'

<!doctype html>
<html lang="vi" data-app-shield>
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom stays enabled (accessibility); inputs use 16px text so iOS does not auto-zoom on focus.
         interactive-widget: on Android the layout shrinks above the keyboard, so the composer toolbar
         and the comment bar stay visible while typing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Same colour as the manifest's theme_color / background_color and the page background (--bg). -->
    <meta name="theme-color" content="#faf7f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Home-screen name on iPhone: fixed, so a tab title with a count ("(3) Love Within") is never used. -->
    <meta name="apple-mobile-web-app-title" content="Love Within" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS needs a PNG for the home-screen icon (it ignores SVG); full square, iOS rounds the corners. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Love Within</title>
    <link rel="stylesheet" href="/app-lock-bootstrap.css" />
    <script src="/app-lock-bootstrap.js"></script>
  </head>
  <body>
    <div id="app-lock-bootstrap" role="status">♥ Love Within</div>
    <div id="app-lock-entry"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
